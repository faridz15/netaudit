!
! Last configuration change at 09:14:22 WIB Mon Mar 3 2025
!
version 15.7
service timestamps debug uptime
service timestamps log uptime
no service password-encryption
!
hostname BR-JKT-RTR-01
!
boot-start-marker
boot-end-marker
!
enable password cisco123
!
no aaa new-model
!
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
interface Loopback0
 ip address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description WAN-to-CORE
 ip address 172.16.10.2 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description LAN-BRANCH-JKT
 ip address 192.168.10.1 255.255.255.0
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/3
 no ip address
 duplex auto
 speed auto
!
router ospf 1
 network 10.255.0.1 0.0.0.0 area 0
 network 172.16.10.0 0.0.0.3 area 0
 network 192.168.10.0 0.0.0.255 area 1
!
ip forward-protocol nd
ip http server
ip http secure-server
!
snmp-server community public RO
snmp-server community private RW
snmp-server location Jakarta Branch Office
snmp-server contact noc@example.co.id
!
control-plane
!
line con 0
 password cisco
 login
line aux 0
line vty 0 4
 password cisco
 login
 transport input telnet ssh
line vty 5 15
 password cisco
 login
 transport input telnet ssh
!
end
