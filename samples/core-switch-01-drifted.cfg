!
! Last configuration change at 22:41:03 WIB Tue Mar 11 2025
!
version 15.2
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
!
hostname CR-JKT-SW-01
!
boot-start-marker
boot-end-marker
!
security passwords min-length 8
enable secret 5 $1$aBcD$eFgHiJkLmNoPqRsTuV0
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
!
login block-for 120 attempts 3 within 60
login on-failure log
login on-success log
!
no ip source-route
no ip http server
ip http secure-server
ip http authentication aaa
no service tcp-small-servers
no service udp-small-servers
no cdp run
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
ip domain-name corp.example.co.id
!
interface Loopback0
 ip address 10.255.0.10 255.255.255.255
!
interface Vlan10
 description MGMT-VLAN
 ip address 10.0.0.1 255.255.255.0
 no ip directed-broadcast
 no ip proxy-arp
!
interface Vlan20
 description USER-VLAN
 ip address 10.0.20.1 255.255.255.0
 no ip directed-broadcast
 no ip proxy-arp
!
interface GigabitEthernet1/0/1
 description UPLINK-TO-BR-JKT-RTR-01
 switchport mode trunk
!
interface GigabitEthernet1/0/2
 description ACCESS-FLOOR-2
 switchport mode access
 switchport access vlan 20
!
interface GigabitEthernet1/0/24
 description UNUSED
 shutdown
!
ip access-list standard MGMT-HOSTS
 permit 10.0.0.0 0.0.0.255
 deny   any log
!
ip access-list standard SNMP-HOSTS
 permit 10.0.0.20
 deny   any log
!
snmp-server community Str0ngC0mmun1ty RO SNMP-HOSTS
snmp-server community backup RW
snmp-server location Jakarta Core DC
snmp-server contact noc@example.co.id
!
! logging host removed during troubleshooting 2025-03-11
logging trap informational
logging buffered 64000 informational
!
ntp authenticate
ntp authentication-key 1 md5 071B2A4F5D 7
ntp trusted-key 1
ntp server 10.0.0.30
ntp server 10.0.0.31
!
banner login ^C
  Authorised access only. All activity is monitored and logged.
  Disconnect immediately if you are not an authorised user.
^C
!
line con 0
 exec-timeout 10 0
 logging synchronous
line aux 0
 no exec
 transport input none
line vty 0 4
 exec-timeout 10 0
 logging synchronous
 transport input ssh telnet
 transport output ssh
line vty 5 15
 exec-timeout 10 0
 transport input ssh telnet
 transport output ssh
!
end
